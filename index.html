<style>
/* Layout: sticky bar with search + section chips, then price sections as 2-column cards (1 column on phones). */
:root{
  --bg:#f6f3f8; --surface:#ffffff; --surface-2:#efeaf4; --line:#cdc3da;
  --fg:#1b1625; --muted:#6c6379; --accent:#d42a66; --accent-fg:#ffffff; --chip:#e8e0f0; --mark:#ffd9e6; --resv:#a85a00;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0b14; --surface:#18141f; --surface-2:#221c2c; --line:#3a3049;
    --fg:#f1ecf6; --muted:#9a90a8; --accent:#ff5c8a; --accent-fg:#1a0b13; --chip:#2a2236; --mark:#5a2140; --resv:#ffb454;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0b14; --surface:#18141f; --surface-2:#221c2c; --line:#3a3049;
  --fg:#f1ecf6; --muted:#9a90a8; --accent:#ff5c8a; --accent-fg:#1a0b13; --chip:#2a2236; --mark:#5a2140; --resv:#ffb454;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
header.hero{padding:36px 0 22px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,64px);letter-spacing:-.02em;line-height:1;margin:0;text-wrap:balance}
h1 i{font-style:normal;color:var(--accent)}
.stats{margin:6px 0 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px}
.menu-btn{flex:none;position:relative;width:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.menu-btn.on::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.menu-btn:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu{position:absolute;left:0;top:calc(100% + 6px);min-width:230px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.28);z-index:20}
.mi{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--fg);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.mi:hover{background:var(--surface-2)}
.menu .mi{position:relative;z-index:1;transition:color .25s}
.menu .mi.cur{color:var(--accent-fg)}
.menu .mi.cur:hover{background:none}
.mi-bar{position:absolute;left:6px;right:6px;top:0;height:0;border-radius:10px;background:var(--accent);z-index:0;pointer-events:none}
.search{display:block;flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.search::placeholder{color:var(--muted)}
.search:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip{transition:background .22s,color .22s,border-color .22s,transform .15s}
.chip:active{transform:scale(.94)}
.chip.rst{background:none;border-style:dashed;color:var(--muted)}
.chip[hidden]{display:none}
.fbtn{flex:none;position:relative;width:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:background .22s,color .22s,border-color .22s}
.fbtn[aria-expanded="true"],.fbtn.on{border-color:var(--accent);color:var(--accent)}
.fbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fbtn b{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:800;line-height:18px;text-align:center}
.fbtn b[hidden]{display:none}
.tagw{overflow:hidden;padding:0 2px}
.tagw[hidden]{display:none}
.tagw .chips{margin-top:10px;padding:2px 0}
.tginfo{margin:8px 2px 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
body.editing .fbtn,body.editing .tagw{display:none}
.rv-u{color:var(--muted);font-size:12px;margin:0 6px}
.rv-x.rv-s{margin-left:4px}
.rv-sum{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 4px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-weight:700}
.rv-sum b{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.rv-u.ex{color:var(--resv)}
section.group{margin-top:34px}
.ghead{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--accent);margin-bottom:16px}
.ghead h2{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(16px,3.6vw,22px);letter-spacing:.02em;text-transform:uppercase}
.ghead h2 b{font-weight:700;color:var(--accent)}
.ghead span{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.grid{align-items:start;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.card.one{grid-column:1 / -1}
.pic{width:96px;aspect-ratio:1;border-radius:14px;object-fit:cover;background:var(--surface-2);display:block}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0;font-size:16px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.pills{display:flex;gap:0;flex:none;border-radius:8px;overflow:hidden;font-size:12px;font-weight:800;white-space:nowrap}
.pills span{padding:5px 9px;background:var(--chip);color:var(--fg)}
.pills span.price{background:var(--accent);color:var(--accent-fg)}
ul.fl{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line);columns:2 170px;column-gap:20px;font-size:14px}
ul.fl li{break-inside:avoid;padding:2px 0 2px 14px;position:relative;overflow-wrap:anywhere}
ul.fl li::before{content:"";position:absolute;left:1px;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.qty{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:800;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{margin:60px 0;text-align:center;color:var(--muted)}
footer{margin-top:48px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .card.one{grid-column:auto}
  .card{grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px}
  .pic{width:76px;border-radius:12px}
  .top{flex-direction:column;gap:6px}
  ul.fl{columns:1}
}
.intro-on header.hero h1{visibility:hidden}
.intro-on .bar,.intro-on main,.intro-on footer{opacity:0}
.intro-bg{position:fixed;inset:0;background:var(--bg);z-index:29}
.intro-big{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;margin:0;opacity:0;pointer-events:none;white-space:nowrap;color:var(--fg);font-family:var(--display);font-weight:700;font-size:clamp(38px,11vw,132px);letter-spacing:-.02em;line-height:1}
.intro-big .d{display:inline-block;font-style:normal;color:var(--accent)}
.intro-big .dd{display:inline-block;transform-origin:50% 85%}
img.pic{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:40;background:rgba(8,5,12,.88);display:flex;align-items:center;justify-content:center;touch-action:none;overscroll-behavior:contain}
.lb[hidden]{display:none}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb-img{width:min(88vw,78vh);height:min(88vw,78vh);object-fit:cover;border-radius:18px;background:#fff;user-select:none;-webkit-user-select:none;will-change:transform;transform-origin:50% 50%;cursor:grab;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-img.drag{cursor:grabbing}
.lb-tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.lb-tools button{width:42px;height:42px;border:0;border-radius:50%;background:none;color:var(--fg);font:inherit;font-size:24px;line-height:1;cursor:pointer}
.lb-tools button:hover{background:var(--surface-2)}
.lb-tools button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lb-tools span{min-width:52px;text-align:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
ul.fl li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
ul.fl li .ft{flex:1 1 0;min-width:0}
.acts{flex:none;display:flex;align-items:center;gap:6px}
.sub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:18px;font-weight:800;line-height:1;cursor:pointer}
.sub:hover{background:var(--surface-2)}
.sub[hidden]{display:none}
.sub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{flex:none;min-width:30px;height:30px;padding:0 8px;border-radius:999px;border:1.5px solid var(--accent);background:none;color:var(--accent);font:inherit;font-size:18px;font-weight:800;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.add:hover{background:var(--mark)}
.add.in{background:var(--accent);color:var(--accent-fg);font-size:13px}
.add:focus-visible,.fab:focus-visible,.cart button:focus-visible,.cart a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;height:52px;padding:0 18px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.fab b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent-fg);color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
.intro-on .fab{opacity:0}
.cart-back{position:fixed;inset:0;z-index:35;background:rgba(8,5,12,.6)}
.cart{position:fixed;top:0;right:0;bottom:0;z-index:36;width:min(420px,100vw);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cart[hidden],.cart-back[hidden]{display:none}
.cart-h{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.cart-h h2{margin:0;font-family:var(--display);font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.cart-h .clr{margin-left:auto;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
.cart-h .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);font-size:20px;line-height:1;cursor:pointer}
.cart-list{flex:1;min-height:0;overflow-y:auto;padding:8px 16px}
.cart-empty{margin:40px 0;text-align:center;color:var(--muted)}
.ci{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .tx{flex:1;min-width:0}
.ci .tx small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.ci .tx span{display:block;font-weight:800;overflow-wrap:anywhere}
.step{flex:none;display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px}
.step button{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--fg);padding:0;line-height:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.step button:disabled{opacity:.3;cursor:default}
.step i{min-width:20px;text-align:center;font-style:normal;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.cart-f{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.cart-f p{margin:0;font-size:12px;color:var(--muted)}
.buy{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:16px}
.buy[aria-disabled="true"]{opacity:.4;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;text-align:center}
.toast[hidden]{display:none}
.stp{display:flex;align-items:center;gap:2px;border:1.5px solid var(--accent);border-radius:999px;padding:1px}
.stp[hidden]{display:none}
.stp .sub,.stp .add{width:28px;min-width:28px;height:28px;padding:0;border:0;border-radius:50%;background:none;color:var(--accent);line-height:0;display:inline-flex;align-items:center;justify-content:center}
.stp svg,.add0 svg,.step svg{display:block}
.stp .sub,.stp .add{-webkit-tap-highlight-color:transparent}
.stp .sub:hover,.stp .add:hover{background:none}
.stp .sub:focus-visible,.stp .add:focus-visible{outline:none;background:var(--surface-2)}
.qin{width:36px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--fg);text-align:center;font:inherit;font-weight:800;font-size:16px;padding:0;font-variant-numeric:tabular-nums}
.qin{-webkit-tap-highlight-color:transparent}
.qin:focus,.qin:focus-visible{outline:none;background:var(--surface-2)}
ul.fl li.rv .ft{color:var(--resv)}
.qty.resv{background:transparent;color:var(--resv);box-shadow:inset 0 0 0 1px var(--resv)}
.qty svg{width:12px;height:12px;vertical-align:-2px;margin-right:4px;flex:none}
.qty.nw{background:var(--accent);color:var(--accent-fg)}
h1{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.end{display:flex;align-items:center;gap:14px;margin:44px 0 0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.end::before,.end::after{content:"";flex:1;height:1px;background:var(--line)}
.end:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.upw{display:flex;justify-content:center;margin:18px 0 8px}
.up{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:14px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.up:active{transform:scale(.96)}
.up:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev-back{position:fixed;inset:0;z-index:45;background:rgba(8,5,12,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dev-back[hidden]{display:none}
.dev{width:min(340px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dev-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 10px}
.dev-h h2{margin:0;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.dev-h h2.out{cursor:pointer;padding:7px 12px;border-radius:999px;background:var(--surface-2);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.dev-h h2.out:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev-h button{width:32px;height:32px;border:0;border-radius:50%;background:var(--surface-2);color:var(--fg);font-size:18px;line-height:1;cursor:pointer}
.dev-h button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev-note{margin:0 4px 10px;font-size:13px;color:var(--muted)}
.dev-l{display:block;margin:0 4px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.dev-in{display:block;width:calc(100% - 8px);margin:0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.dev-in:focus-visible,.ed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev-err{margin:8px 4px 0;font-size:14px;font-weight:700;color:var(--accent)}
.dev-err.good{color:var(--muted)}
.dev-err[hidden]{display:none}
.dev-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 4px 2px}
.dev-btn{padding:11px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.dev-btn.ghost{background:var(--surface-2);color:var(--fg)}
.dev-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev.adm{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto}
.ed{display:block;width:calc(100% - 8px);margin:0 4px;height:min(52vh,420px);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.lg{display:grid;gap:2px;padding:0 4px 4px;font-size:14px}
.lg-i{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.lg-d{flex:none;width:130px;color:var(--muted);font-variant-numeric:tabular-nums}
.lg-m{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.lg-i{flex-direction:column;gap:2px}.lg-d{width:auto}}

  function get(){ try{ var v = localStorage.getItem(KEY); return MODES.indexOf(v) >= 0 ? v : "auto"; }catch(e){ return "auto"; } }

    var m = get(), h = document.documentElement;
    if(m === "auto") h.removeAttribute("data-theme"); else h.setAttribute("data-theme", m);

<script>
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function parsePrice(text){
  var cfg = {telegram:"kooot45"}, data = [], pre = [], g = null, it = null, started = false;
  String(text || "").split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(), m;
    if(!started && !(line.charAt(0)==="#")) pre.push(raw);
    if(!line || line.indexOf("//")===0) return;
    if((m = line.match(/^(?:telegram|tg)\s*:\s*@?(\S+)/i))){ cfg.telegram = m[1]; return; }
    if(line.indexOf("##")===0){
      if(!g) return;
      var p = line.replace(/^##\s*/,"").split("|").map(function(x){return x.trim();});
      it = {n:p[0], s:parseInt(p[1],10)||0, p:p[2]||"", img:(p[3]&&p[3]!=="-")?p[3]:"", f:[], g:g};
      g.items.push(it); return;
    }
    if(line.charAt(0)==="#"){
      started = true;
      var q = line.replace(/^#\s*/,"").split("|"), title = q[0].trim();
      g = {id:"s"+data.length, raw:line, head:esc(title).replace(/\*([^*]+)\*/g,"<b>$1</b>"), menu:(q[1]||title.replace(/\*/g,"")).trim(), liq:/^жидкост/i.test(title), items:[]};
      data.push(g); it = null; return;
    }
    if(line.charAt(0)==="-" && it){ var fl = line.replace(/^-\s*/,"").trim(); if(fl) it.f.push(fl); }
  });
  var n = 0; data.forEach(function(gr){ gr.items.forEach(function(x){ x.id = n++; }); });
  while(pre.length && !pre[pre.length-1].trim()) pre.pop();
  return {cfg:cfg, data:data, pre:pre};
}
function serialize(){
  var out = PRE.slice(); out.push("");

    out.push(g.raw, "");
    g.items.forEach(function(it){
      out.push("## " + [it.n, it.s||"-", it.p||"-", it.img||"-"].join(" | "));

}

/* бронь на срок: «бронь» или «бронь до 2026-11-09 18:00» (время по Минску) */
var MSK = 3*3600e3;
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function mskStr(ms){ var d = new Date(ms + MSK); return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth()+1) + "-" + pad2(d.getUTCDate()) + " " + pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes()); }
function rvOf(qty){
  var m = String(qty || "").trim().match(/^бронь(?:\s+до\s+(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}))?$/i);
  if(!m) return null;
  var until = m[1] ? Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5]) - MSK : 0;
  return {until:until, expired: !!until && until <= Date.now()};
}
function rvLabel(r){
  if(!r) return ""; if(r.expired) return "бронь истекла"; if(!r.until) return "бронь";
  var d = new Date(r.until + MSK), n = new Date(Date.now() + MSK);
  var same = d.getUTCFullYear() === n.getUTCFullYear() && d.getUTCMonth() === n.getUTCMonth() && d.getUTCDate() === n.getUTCDate();
  return "бронь до " + (same ? "" : pad2(d.getUTCDate()) + "." + pad2(d.getUTCMonth()+1) + " ") + pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes());
}
function rvText(ms){ return ms > 0 ? "бронь до " + mskStr(ms) : "бронь"; }
function termMs(k, custom){
  var n = Date.now();
  if(k === "1h") return n + 3600e3; if(k === "3h") return n + 3*3600e3; if(k === "1d") return n + 24*3600e3; if(k === "3d") return n + 72*3600e3;

  return 0;
}

var TAGS = [

  ["cool","Холодок",/(?:^|[^а-я])(?:лед|льд|ледян|мят|мороз|снег|холс|мохито)/],

  ["drink","Напитки",/лимонад|(?:^|[^а-я])кол[аыуе]|коктейл|(?:^|[^а-я])сок|содов|мохито|морс|спрайт|фреш|смузи|слаш/],

function tagsOf(f){

  var s = " " + n.toLowerCase().replace(/ё/g, "е") + " ", out = [];

}

}

};
var NEW_MS = 3*24*3600e3;

}

function render(){

    document.body.appendChild(el);
    var path = el.querySelector("path");
    el.animate([{transform:"scale(.3)",opacity:0},{transform:"scale(1.08)",opacity:1,offset:.6},{transform:"scale(1)",opacity:1}],{duration:340,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"});
    path.animate([{strokeDashoffset:40},{strokeDashoffset:0}],{duration:360,delay:180,easing:"ease-out",fill:"forwards"});
    setTimeout(function(){ var a = el.animate([{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(.8)"}],{duration:240,fill:"forwards"}); a.onfinish = function(){ if(el.parentNode) el.parentNode.removeChild(el); }; }, 1000);
  }

  /* пока открыто окно, страница за ним не прокручивается */
  var locked = false, lockY = 0;
  function syncLock(){
    var on = !!document.querySelector("#cart:not([hidden]), .dev-back:not([hidden]), .sheet-back, #lb:not([hidden])");
    if(on === locked) return; locked = on;
    var b = document.body;
    if(on){ lockY = window.pageYOffset; b.style.position = "fixed"; b.style.top = (-lockY) + "px"; b.style.left = "0"; b.style.right = "0"; b.style.width = "100%"; }
    else { b.style.position = b.style.top = b.style.left = b.style.right = b.style.width = ""; window.scrollTo({top:lockY, behavior:"instant"}); }
  }
  new MutationObserver(syncLock).observe(document.body, {subtree:true, childList:true, attributes:true, attributeFilter:["hidden"]});

  /* пять нажатий на заголовок (одно — если права администратора уже получены) */
  var title = document.querySelector("header.hero h1"), taps = 0, tt2, devAt = 0;
  dev.onBackdrop = function(){ return Date.now() - devAt > 4000; };
  if(title) title.addEventListener("click", function(){
    if(isAdmin){ taps = 0; clearTimeout(tt2); devAt = Date.now(); drawMenu(); dev.set(true); return; }
    taps++; clearTimeout(tt2);
    tt2 = setTimeout(function(){ taps = 0; }, 600);
    if(taps >= 5){ taps = 0; devAt = Date.now(); drawMenu(); dev.set(true); }
  });
})();
</script>
