<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>На пиво</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;800&display=swap">
<style>
/* Layout: sticky bar with search + section chips, then price sections as 2-column cards (1 column on phones). */
:root{
  --bg:#f6f3f8; --surface:#ffffff; --surface-2:#efeaf4; --line:#ddd5e6;
  --fg:#1b1625; --muted:#6c6379; --accent:#e63a76; --accent-fg:#ffffff; --chip:#e8e0f0; --mark:#ffd9e6; --resv:#c26a00;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0b14; --surface:#18141f; --surface-2:#221c2c; --line:#2e2639;
    --fg:#f1ecf6; --muted:#9a90a8; --accent:#ff5c8a; --accent-fg:#1a0b13; --chip:#2a2236; --mark:#5a2140; --resv:#ffb454;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0b14; --surface:#18141f; --surface-2:#221c2c; --line:#2e2639;
  --fg:#f1ecf6; --muted:#9a90a8; --accent:#ff5c8a; --accent-fg:#1a0b13; --chip:#2a2236; --mark:#5a2140; --resv:#ffb454;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
header.hero{padding:36px 0 22px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,64px);letter-spacing:-.02em;line-height:1;margin:0;text-wrap:balance}
h1 i{font-style:normal;color:var(--accent)}
.stats{margin:6px 0 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px}
.menu-btn{flex:none;position:relative;width:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.menu-btn.on::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.menu-btn:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu{position:absolute;left:0;top:calc(100% + 6px);min-width:230px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.28);z-index:20}
.mi{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--fg);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.mi:hover{background:var(--surface-2)}
.mi[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.search{display:block;flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.search::placeholder{color:var(--muted)}
.search:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
section.group{margin-top:34px}
.ghead{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--accent);margin-bottom:16px}
.ghead h2{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(16px,3.6vw,22px);letter-spacing:.02em;text-transform:uppercase}
.ghead h2 b{font-weight:700;color:var(--accent)}
.ghead span{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.grid{align-items:start;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.card.one{grid-column:1 / -1}
.pic{width:96px;aspect-ratio:1;border-radius:14px;object-fit:cover;background:var(--surface-2);display:block}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0;font-size:16px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.pills{display:flex;gap:0;flex:none;border-radius:8px;overflow:hidden;font-size:12px;font-weight:800;white-space:nowrap}
.pills span{padding:5px 9px;background:var(--chip);color:var(--fg)}
.pills span.price{background:var(--accent);color:var(--accent-fg)}
ul.fl{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line);columns:2 170px;column-gap:20px;font-size:14px}
ul.fl li{break-inside:avoid;padding:2px 0 2px 14px;position:relative;overflow-wrap:anywhere}
ul.fl li::before{content:"";position:absolute;left:1px;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.qty{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:800;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{margin:60px 0;text-align:center;color:var(--muted)}
footer{margin-top:48px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .card.one{grid-column:auto}
  .card{grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px}
  .pic{width:76px;border-radius:12px}
  .top{flex-direction:column;gap:6px}
  ul.fl{columns:1}
}
.intro-on header.hero h1{visibility:hidden}
.intro-on .bar,.intro-on main,.intro-on footer{opacity:0}
.intro-bg{position:fixed;inset:0;background:var(--bg);z-index:29}
.intro-big{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;margin:0;opacity:0;pointer-events:none;white-space:nowrap;color:var(--fg);font-family:var(--display);font-weight:700;font-size:clamp(38px,11vw,132px);letter-spacing:-.02em;line-height:1}
.intro-big .d{display:inline-block;font-style:normal;color:var(--accent)}
.intro-big .dd{display:inline-block;transform-origin:50% 85%}
img.pic{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:40;background:rgba(8,5,12,.88);display:flex;align-items:center;justify-content:center;touch-action:none;animation:lbin .18s ease-out;overscroll-behavior:contain}
.lb[hidden]{display:none}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb-img{width:min(88vw,78vh);height:min(88vw,78vh);object-fit:cover;border-radius:18px;background:#fff;user-select:none;-webkit-user-select:none;will-change:transform;transform-origin:50% 50%;cursor:grab;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-img.drag{cursor:grabbing}
.lb-tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.lb-tools button{width:42px;height:42px;border:0;border-radius:50%;background:none;color:var(--fg);font:inherit;font-size:24px;line-height:1;cursor:pointer}
.lb-tools button:hover{background:var(--surface-2)}
.lb-tools button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lb-tools span{min-width:52px;text-align:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
ul.fl li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
ul.fl li .ft{flex:1 1 0;min-width:0}
.acts{flex:none;display:flex;align-items:center;gap:6px}
.sub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:18px;font-weight:800;line-height:1;cursor:pointer}
.sub:hover{background:var(--surface-2)}
.sub[hidden]{display:none}
.sub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{flex:none;min-width:30px;height:30px;padding:0 8px;border-radius:999px;border:1.5px solid var(--accent);background:none;color:var(--accent);font:inherit;font-size:18px;font-weight:800;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.add:hover{background:var(--mark)}
.add.in{background:var(--accent);color:var(--accent-fg);font-size:13px}
.add:focus-visible,.fab:focus-visible,.cart button:focus-visible,.cart a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;height:52px;padding:0 18px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.fab b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent-fg);color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
.intro-on .fab{opacity:0}
.cart-back{position:fixed;inset:0;z-index:35;background:rgba(8,5,12,.6)}
.cart{position:fixed;top:0;right:0;bottom:0;z-index:36;width:min(420px,100vw);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cart[hidden],.cart-back[hidden]{display:none}
.cart-h{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.cart-h h2{margin:0;font-family:var(--display);font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.cart-h .clr{margin-left:auto;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
.cart-h .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);font-size:20px;line-height:1;cursor:pointer}
.cart-list{flex:1;min-height:0;overflow-y:auto;padding:8px 16px}
.cart-empty{margin:40px 0;text-align:center;color:var(--muted)}
.ci{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .tx{flex:1;min-width:0}
.ci .tx small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.ci .tx span{display:block;font-weight:800;overflow-wrap:anywhere}
.step{flex:none;display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px}
.step button{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--fg);padding:0;line-height:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.step button:disabled{opacity:.3;cursor:default}
.step i{min-width:20px;text-align:center;font-style:normal;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.cart-f{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.cart-f p{margin:0;font-size:12px;color:var(--muted)}
.buy{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:16px}
.buy[aria-disabled="true"]{opacity:.4;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;text-align:center}
.toast[hidden]{display:none}
.stp{display:flex;align-items:center;gap:2px;border:1.5px solid var(--accent);border-radius:999px;padding:1px}
.stp[hidden]{display:none}
.stp .sub,.stp .add{width:28px;min-width:28px;height:28px;padding:0;border:0;border-radius:50%;background:none;color:var(--accent);line-height:0;display:inline-flex;align-items:center;justify-content:center}
.stp svg,.add0 svg,.step svg{display:block}
.stp .sub,.stp .add{-webkit-tap-highlight-color:transparent}
.stp .sub:hover,.stp .add:hover{background:none}
.stp .sub:focus-visible,.stp .add:focus-visible{outline:none;background:var(--surface-2)}
.qin{width:36px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--fg);text-align:center;font:inherit;font-weight:800;font-size:16px;padding:0;font-variant-numeric:tabular-nums}
.qin{-webkit-tap-highlight-color:transparent}
.qin:focus,.qin:focus-visible{outline:none;background:var(--surface-2)}
ul.fl li.rv .ft{color:var(--resv)}
.qty.resv{background:transparent;color:var(--resv);box-shadow:inset 0 0 0 1px var(--resv)}
h1{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.end{display:flex;align-items:center;gap:14px;margin:44px 0 0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.end::before,.end::after{content:"";flex:1;height:1px;background:var(--line)}
.end:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.upw{display:flex;justify-content:center;margin:18px 0 8px}
.up{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:14px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.up:active{transform:scale(.96)}
.up:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev-back{position:fixed;inset:0;z-index:45;background:rgba(8,5,12,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dev-back[hidden]{display:none}
.dev{width:min(340px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dev-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 10px}
.dev-h h2{margin:0;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.dev-h button{width:32px;height:32px;border:0;border-radius:50%;background:var(--surface-2);color:var(--fg);font-size:18px;line-height:1;cursor:pointer}
.dev-h button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev-note{margin:0 4px 10px;font-size:13px;color:var(--muted)}
.dev-l{display:block;margin:0 4px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.dev-in{display:block;width:calc(100% - 8px);margin:0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.dev-in:focus-visible,.ed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev-err{margin:8px 4px 0;font-size:14px;font-weight:700;color:var(--accent)}
.dev-err.good{color:var(--muted)}
.dev-err[hidden]{display:none}
.dev-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 4px 2px}
.dev-btn{padding:11px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.dev-btn.ghost{background:var(--surface-2);color:var(--fg)}
.dev-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev.adm{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto}
.ed{display:block;width:calc(100% - 8px);margin:0 4px;height:min(52vh,420px);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.lg{display:grid;gap:2px;padding:0 4px 4px;font-size:14px}
.lg-i{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.lg-d{flex:none;width:130px;color:var(--muted);font-variant-numeric:tabular-nums}
.lg-m{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.lg-i{flex-direction:column;gap:2px}.lg-d{width:auto}}

body.editing .upw,body.editing .bar,body.editing .fab,body.editing footer,body.editing .hero{display:none!important}
body.editing{padding-top:64px}
.editbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.editbar[hidden]{display:none}
.editbar b{flex:1;min-width:0;font-size:14px;line-height:1.2}
.editbar button{padding:9px 14px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.editbar button.ghost{background:var(--surface-2);color:var(--fg)}
body.editing .card h3,body.editing .pills,body.editing ul.fl li,body.editing .pic{cursor:pointer;-webkit-tap-highlight-color:transparent}
body.editing ul.fl li{border-radius:8px}
body.editing ul.fl li:hover,body.editing .card h3:hover{background:var(--surface-2)}
body.editing ul.fl li.rv{background:rgba(255,180,84,.12)}
.pic.nopic{display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.2;color:var(--muted);border:1.5px dashed var(--line);padding:4px;box-sizing:border-box;outline:0;user-select:text;-webkit-user-select:text}
.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(8,5,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-back.mid{align-items:center;padding:16px}
.sheet{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px;display:grid;gap:6px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.mid .sheet{border-radius:18px}
.sheet p{margin:0 4px 6px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.sheet .sb{padding:13px 14px;border:0;border-radius:12px;background:var(--surface-2);color:var(--fg);font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.sheet .sb.pri{background:var(--accent);color:var(--accent-fg)}
.sheet .sb.dan{color:#e5484d}
.sheet .dev-in{width:100%;box-sizing:border-box}
.rvl{display:grid;gap:10px;padding:0 4px 4px;color:var(--muted);font-size:14px;max-height:62vh;overflow:auto}
.rv-i{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--surface-2);color:var(--fg)}
.rv-p{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg)}
.rv-t{min-width:0}.rv-t b{display:block;font-size:15px;margin-bottom:4px}
.rv-t ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.rv-t li{font-size:14px;padding-left:16px;position:relative}
.rv-t li:before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:#ffb454}
.ed.cd{height:150px;width:calc(100% - 8px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>НА ПИВО<i>.</i></h1>
  </header>
  <div class="bar">
    <div class="row">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Разделы" aria-expanded="false" aria-controls="menu">
        <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M1 1.5h18M1 7h18M1 12.5h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <input class="search" id="q" type="search" placeholder="Найти вкус или линейку: клубника, энергетик, OGGO…" autocomplete="off" aria-label="Поиск по прайсу">
    </div>

<script>
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function parsePrice(text){
  var cfg = {telegram:"kooot45"}, data = [], pre = [], g = null, it = null, started = false;
  String(text || "").split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(), m;
    if(!started && !(line.charAt(0)==="#")) pre.push(raw);
    if(!line || line.indexOf("//")===0) return;
    if((m = line.match(/^(?:telegram|tg)\s*:\s*@?(\S+)/i))){ cfg.telegram = m[1]; return; }
    if(line.indexOf("##")===0){
      if(!g) return;
      var p = line.replace(/^##\s*/,"").split("|").map(function(x){return x.trim();});
      it = {n:p[0], s:parseInt(p[1],10)||0, p:p[2]||"", img:(p[3]&&p[3]!=="-")?p[3]:"", f:[], g:g};
      g.items.push(it); return;
    }
    if(line.charAt(0)==="#"){
      started = true;
      var q = line.replace(/^#\s*/,"").split("|"), title = q[0].trim();
      g = {id:"s"+data.length, raw:line, head:esc(title).replace(/\*([^*]+)\*/g,"<b>$1</b>"), menu:(q[1]||title.replace(/\*/g,"")).trim(), liq:/^жидкост/i.test(title), items:[]};
      data.push(g); it = null; return;
    }
    if(line.charAt(0)==="-" && it){ var fl = line.replace(/^-\s*/,"").trim(); if(fl) it.f.push(fl); }
  });
  var n = 0; data.forEach(function(gr){ gr.items.forEach(function(x){ x.id = n++; }); });
  while(pre.length && !pre[pre.length-1].trim()) pre.pop();
  return {cfg:cfg, data:data, pre:pre};
}
function serialize(){
  var out = PRE.slice(); out.push("");
  DATA.forEach(function(g){
    out.push(g.raw, "");
    g.items.forEach(function(it){
      out.push("## " + [it.n, it.s||"-", it.p||"-", it.img||"-"].join(" | "));
      it.f.forEach(function(f){ out.push("- " + f); });
      out.push("");
    });
  });
  return out.join("\n").replace(/\s+$/,"");
}
var __P = parsePrice(window.PRICE_TEXT), CFG = __P.cfg, DATA = __P.data, PRE = __P.pre, EDIT = null, PREV = {};
function picSrc(n){ return PREV[n] || ("img/" + encodeURI(n)); }
var state = {sec:"all", q:""};
try{ var saved = localStorage.getItem("napivo-sec"); if(saved) state.sec = saved; }catch(e){}

function hl(text,q){
  var t = esc(text); if(!q) return t;
  var i = text.toLowerCase().indexOf(q); if(i<0) return t;
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function flav(f,q,k,j){
  var parts = f.split(" · "), name = parts[0], qty = parts[1], rv = !!qty && qty.toLowerCase() === "бронь";
  if(EDIT) return '<li data-e="fl" data-j="'+j+'"'+(rv?' class="rv"':'')+'><span class="ft">'+esc(name)+(qty?'<span class="qty'+(rv?' resv':'')+'">'+esc(qty)+"</span>":"")+'</span></li>';
  if(rv) return '<li class="rv"><span class="ft">'+hl(name,q)+'<span class="qty resv">бронь</span></span></li>';
  return '<li><span class="ft">'+hl(name,q)+(qty?'<span class="qty">'+esc(qty)+"</span>":"")+'</span><span class="acts" data-k="'+k+'"><button class="add add0" type="button" data-k="'+k+'" aria-label="Добавить в корзину"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9M6 1.5v9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button><span class="stp" hidden><button class="sub" type="button" data-k="'+k+'" aria-label="Убрать один"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button><input class="qin" type="text" inputmode="numeric" pattern="[0-9]*" value="1" data-k="'+k+'" aria-label="Количество"><button class="add" type="button" data-k="'+k+'" aria-label="Добавить ещё один"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9M6 1.5v9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button></span></span></li>';
}
function card(it,q,single){
  var pills = (it.s?'<span>крепость '+it.s+'</span>':'')+'<span class="price">цена '+it.p+'</span>';
  var img = it.img ? '<img class="pic"'+(EDIT?' data-e="pic"':'')+' alt="'+esc(it.n)+'" loading="lazy" src="'+picSrc(it.img)+'">' : (EDIT ? '<div class="pic nopic" data-e="pic" contenteditable="true" spellcheck="false">Без изображения</div>' : '<div class="pic"></div>');
  var gi = DATA.indexOf(it.g), ii = it.g.items.indexOf(it);
  var nameMatch = q && it.n.toLowerCase().indexOf(q)>=0;
  var list = it.f.map(function(x,j){return [x,j];}).filter(function(a){return !q || nameMatch || a[0].toLowerCase().indexOf(q)>=0;});
  return '<article class="card'+(single?' one':'')+'" data-gi="'+gi+'" data-ii="'+ii+'">'+img+'<div><div class="top"><h3'+(EDIT?' data-e="line"':'')+'>'+hl(it.n,q)+'</h3><div class="pills"'+(EDIT?' data-e="line"':'')+'>'+pills+'</div></div><ul class="fl">'+list.map(function(a){return flav(a[0],q,it.id+"."+a[1],a[1]);}).join("")+'</ul></div></article>';
}
function render(){
  var q = state.q.trim().toLowerCase(), html = "", shown = 0;
  DATA.forEach(function(g){
    if(state.sec!=="all" && state.sec!==g.id) return;
    var items = g.items.filter(function(it){
      return !q || it.n.toLowerCase().indexOf(q)>=0 || it.f.some(function(x){return x.toLowerCase().indexOf(q)>=0;});
    });
    if(!items.length) return;
    shown += items.length;
    var head = g.head;
    html += '<section class="group" id="s-'+g.id+'"><div class="ghead"><h2>'+head+'</h2><span>'+items.length+' '+(g.liq?"линеек":"поз.")+'</span></div><div class="grid">'+
      items.map(function(it,k){return card(it,q,items.length%2===1 && k===items.length-1 && items.length>1 && false);}).join("")+'</div></section>';
  });
  if(state.sec === "all" && !q && shown > 0 && !EDIT) html += '<p class="end" role="button" tabindex="0">Больше ничего нет</p><div class="upw"><button class="up" id="upBtn" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>В начало</button></div>';
  document.getElementById("main").innerHTML = html;
  document.getElementById("empty").hidden = shown>0;
  if(window.syncAdd) window.syncAdd();
}
var MENU = [["all","Всё"]].concat(DATA.map(function(g){ return [g.id, g.menu]; }));
if(!MENU.some(function(m){ return m[0]===state.sec; })) state.sec = "all";
var menuEl = document.getElementById("menu"), menuBtn = document.getElementById("menuBtn");
function chips(){
  menuEl.innerHTML = MENU.map(function(c){return '<button class="mi" type="button" role="menuitem" data-id="'+c[0]+'" aria-pressed="'+(state.sec===c[0])+'">'+c[1]+'</button>';}).join("");
  menuBtn.classList.toggle("on", state.sec!=="all");
}
var menuOpen = false, menuAnim = [];
function setMenu(open){
  menuAnim.forEach(function(a){ try{ a.cancel(); }catch(e){} }); menuAnim = [];
  menuOpen = open; menuBtn.setAttribute("aria-expanded", open?"true":"false");
  var rm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  if(open){
    menuEl.hidden = false;
    if(rm || !menuEl.animate) return;
    menuEl.style.transformOrigin = "0 0";
    menuAnim.push(menuEl.animate([{opacity:0,transform:"translateY(-8px) scale(.96)"},{opacity:1,transform:"none"}],{duration:230,easing:"cubic-bezier(.2,.8,.2,1)"}));
    menuEl.querySelectorAll(".mi").forEach(function(el,i){
      menuAnim.push(el.animate([{opacity:0,transform:"translateX(-10px)"},{opacity:1,transform:"none"}],{duration:260,delay:50+i*30,easing:"ease-out",fill:"backwards"}));
    });
  } else {
    if(menuEl.hidden) return;
    if(rm || !menuEl.animate){ menuEl.hidden = true; return; }
    var a = menuEl.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(-8px) scale(.96)"}],{duration:170,easing:"ease-in",fill:"forwards"});
    menuAnim.push(a);
    a.onfinish = function(){ menuEl.hidden = true; menuAnim.forEach(function(x){ try{ x.cancel(); }catch(e){} }); menuAnim = []; };
  }
}
menuBtn.addEventListener("click",function(e){ e.stopPropagation(); setMenu(!menuOpen); });
menuEl.addEventListener("click",function(e){
  var b = e.target.closest(".mi"); if(!b) return;
  state.sec = b.getAttribute("data-id");
  try{ localStorage.setItem("napivo-sec",state.sec); }catch(err){}
  chips(); render(); setMenu(false); window.scrollTo({top:0});
});
document.addEventListener("click",function(e){ if(menuOpen && !menuEl.contains(e.target)) setMenu(false); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && menuOpen){ setMenu(false); menuBtn.focus(); } });
document.getElementById("q").addEventListener("input",function(e){ state.q = e.target.value; render(); });

chips(); render();

/* Корзина: добавление вкусов, количество, «Купить» копирует заказ и открывает Telegram */
(function(){
  var LOOK = {}, cart = {};
  function buildLook(){ LOOK = {}; DATA.forEach(function(g){ g.items.forEach(function(it){ it.f.forEach(function(x,j){
    var p = x.split(" · "), liquid = g.liq;
    LOOK[it.id+"."+j] = {n:it.n, f:p[0], max: (p[1] && p[1].toLowerCase()==="бронь") ? 0 : (p[1] ? (parseInt(p[1],10)||1) : (liquid ? 1 : 9))};
  }); }); }); }
  buildLook();
  try{ var sv = JSON.parse(localStorage.getItem("napivo-cart")||"{}"); Object.keys(sv).forEach(function(k){ if(LOOK[k] && LOOK[k].max>0 && sv[k]>0) cart[k] = Math.min(sv[k], LOOK[k].max); }); }catch(e){}
  var $ = function(id){ return document.getElementById(id); };
  var listEl=$("cartList"), panel=$("cart"), back=$("cartBack"), buy=$("buy"), toastEl=$("toast"), tt;
  function save(){ try{ localStorage.setItem("napivo-cart", JSON.stringify(cart)); }catch(e){} }
  function count(){ return Object.keys(cart).reduce(function(a,k){ return a+cart[k]; },0); }
  function orderText(){
    var order = [], by = {};
    Object.keys(cart).forEach(function(k){ var n = LOOK[k].n; if(!by[n]){ by[n] = []; order.push(n); } by[n].push(k); });
    var lines = [];
    order.forEach(function(n){
      var ks = by[n];
      if(ks.length === 1){ var k = ks[0]; lines.push(n+" — "+LOOK[k].f+(cart[k]>1 ? " × "+cart[k] : "")); return; }
      lines.push(n);
      ks.forEach(function(k){ lines.push("• "+LOOK[k].f+(cart[k]>1 ? " × "+cart[k] : "")); });
    });
    return "Хочу купить:\n"+lines.join("\n");
  }
  function toast(msg, ms){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ toastEl.hidden = true; }, ms || 2600); }
  window.toast = toast;
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches), stretchKey = null, shrink = {}, cartAnim = [];
  window.syncAdd = function(){
    document.querySelectorAll(".acts").forEach(function(a){
      var k = a.getAttribute("data-k"), n = cart[k]||0;
      var stp = a.querySelector(".stp"), add0 = a.querySelector(".add0");
      if(a._shr){
        if(n === 0) return;
        a._shr.cancel(); a._shr = null;
      }
      if(n === 0 && !stp.hidden && shrink[k] && !reduce && stp.animate){
        add0.hidden = true;
        var an = stp.animate([{clipPath:"inset(0 0 0 0 round 999px)"},{clipPath:"inset(0 0 0 71px round 999px)"}],{duration:260,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
        a._shr = an;
        an.onfinish = function(){
          if(a._shr !== an) return;
          a._shr = null; an.cancel(); stp.hidden = true; add0.hidden = false;
        };
        return;
      }
      add0.hidden = n>0;
      stp.hidden = n===0;
      if(n>0 && stretchKey === k){
        stretchKey = null;
        if(!reduce && stp.animate){
          stp.animate([{clipPath:"inset(0 0 0 71px round 999px)"},{clipPath:"inset(0 0 0 0 round 999px)"}],{duration:300,easing:"cubic-bezier(.2,.8,.2,1)"});
        }
      }
      var inp = a.querySelector(".qin");
      if(document.activeElement !== inp) inp.value = String(n||1);
    });
    shrink = {};
  };
  function draw(){
    var keys = Object.keys(cart);
    $("fabN").textContent = count();
    if(!keys.length){
      listEl.innerHTML = '<p class="cart-empty">Корзина пуста. Нажмите «+» рядом с вкусом, чтобы добавить его.</p>';

    } else {
      listEl.innerHTML = keys.map(function(k){
        var it = LOOK[k], n = cart[k];
        return '<div class="ci"><div class="tx"><small>'+esc(it.n)+'</small><span>'+esc(it.f)+'</span></div><div class="step"><button type="button" data-a="dec" data-k="'+k+'" aria-label="Убрать один"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button><i>'+n+'</i><button type="button" data-a="inc" data-k="'+k+'" aria-label="Добавить один"'+(n>=it.max?' disabled':'')+'><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9M6 1.5v9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button></div></div>';
      }).join("");
      buy.removeAttribute("aria-disabled");
      buy.href = "https://t.me/"+CFG.telegram+"?text="+encodeURIComponent(orderText());
    }
    window.syncAdd(); save();
  }
  function change(k, d){
    var n = (cart[k]||0)+d;
    if(n > LOOK[k].max){ toast("Больше нет в наличии"); return; }
    if((cart[k]||0) === 0 && n > 0) stretchKey = k;
    if((cart[k]||0) > 0 && n <= 0) shrink[k] = true;
    if(n <= 0) delete cart[k]; else cart[k] = n;

  }
  function openCart(o){
    cartAnim.forEach(function(a){ try{ a.cancel(); }catch(e){} }); cartAnim = [];
    if(o){
      panel.hidden = false; back.hidden = false;
      if(reduce || !panel.animate) return;
      cartAnim.push(panel.animate([{transform:"translateX(100%)"},{transform:"none"}],{duration:340,easing:"cubic-bezier(.2,.8,.2,1)"}));
      cartAnim.push(back.animate([{opacity:0},{opacity:1}],{duration:280,easing:"ease-out"}));
      listEl.querySelectorAll(".ci").forEach(function(el,i){
        if(i < 8) cartAnim.push(el.animate([{opacity:0,transform:"translateX(20px)"},{opacity:1,transform:"none"}],{duration:320,delay:140+i*45,easing:"ease-out",fill:"backwards"}));

      });

      a.onfinish = function(){ panel.hidden = true; back.hidden = true; cartAnim.forEach(function(x){ try{ x.cancel(); }catch(e){} }); cartAnim = []; };
    }
  }
  document.addEventListener("click",function(e){

  $("cx").addEventListener("click",function(){ openCart(false); });
  back.addEventListener("click",function(){ openCart(false); });
  var clearing = false;
  function clearCart(){
    if(clearing) return;

      cart = {}; draw(); clearing = false;
      var em = listEl.querySelector(".cart-empty");
      if(em && !reduce && em.animate) em.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:300,easing:"ease-out"});
    }
    if(!items.length || reduce || !items[0].animate){ done(); return; }
    clearing = true;
    var last = null;
    items.forEach(function(el,i){
      var h = el.offsetHeight;
      el.style.overflow = "hidden";
      var an = el.animate([
        {opacity:1, transform:"none", height:h+"px", paddingTop:"12px", paddingBottom:"12px", borderBottomWidth:"1px"},
        {opacity:0, transform:"translateX(70px)", height:h+"px", paddingTop:"12px", paddingBottom:"12px", borderBottomWidth:"1px", offset:.6},
        {opacity:0, transform:"translateX(70px)", height:"0px", paddingTop:"0px", paddingBottom:"0px", borderBottomWidth:"0px"}
      ],{duration:480, delay:Math.min(i,7)*70, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
      if(i === items.length-1 || i === 7) last = an;
    });
    last.onfinish = done;
  }
  $("clr").addEventListener("click", clearCart);
  function afterBuy(){ setTimeout(clearCart, 600); }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !panel.hidden) openCart(false); });
  buy.addEventListener("click",function(e){

    var txt = orderText();

      if(navigator.clipboard && navigator.clipboard.writeText){

  });
  function fallback(txt){
    var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta); ta.select();

  $("tgnote").textContent = "Заказ скопируется, и откроется чат в Telegram @"+CFG.telegram+". Вставьте текст в сообщение и отправьте.";

(function(){

  }
  function close(){
    lb.hidden = true; ptrs = {}; pinch = null; down = null; closedAt = Date.now();
    document.documentElement.style.overflow = ""; img.removeAttribute("src");
  }
  document.addEventListener("click",function(e){
    if(Date.now() - closedAt < 500 || EDIT) return;
    var p = e.target.closest && e.target.closest("img.pic");
    if(p) open(p.src, p.alt);

    if(ids.length === 2){ var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch = {d:dist(a,b), s:s}; moved = true; }

      if(!log.length){ cdBusy = false; cmsg("Нечего менять: вкусы из кода уже убраны из прайса."); return; }
      var ser = (function(){ var oD = DATA, oP = PRE; DATA = P.data; PRE = P.pre; var t = serialize(); DATA = oD; PRE = oP; return t; })();
      var res = await fetch(api, {method:"PUT", headers:{Accept:"application/vnd.github+json", Authorization:"Bearer " + tok, "Content-Type":"application/json"}, body:JSON.stringify({message:"Правка прайса: " + log.length + " изм.\n\n" + log.join("\n"), content:b64("window.PRICE_TEXT = `\n" + ser + "\n`;\n"), sha:sha, branch:"main"})});
      if(!res.ok) throw {status:res.status};
      try{ localStorage.setItem("napivo-gh", tok); }catch(e){}
      DATA = P.data; PRE = P.pre; EDIT = null;
      var nn = 0; DATA.forEach(function(g){ g.items.forEach(function(x){ x.id = nn++; }); });
      render(); if(window.rebuildLook) window.rebuildLook();
      cdText.value = ""; cmsg(head + ". На сайте обновится через минуту.", true);
    }catch(e){
      var st = e && e.status;
      if(st === 401 || st === 403 || st === 404){ try{ localStorage.removeItem("napivo-gh"); }catch(x){} cmsg("GitHub не принял токен. Нужен доступ Contents → Read and write."); }
      else if(st === 409 || st === 422){ cmsg("Прайс только что изменился. Нажмите «Применить» ещё раз."); }
      else cmsg("Не удалось применить. Проверьте интернет и попробуйте снова.");
    }
    cdBusy = false;
  }


  /* все брони */
  var rv = overlay('<div class="dev adm" role="dialog" aria-modal="true" aria-label="Все брони"><div class="dev-h"><h2>Все брони</h2><button type="button" data-close="1" aria-label="Закрыть">×</button></div><div id="rvBody" class="rvl"></div></div>');
  rv.onClose = function(){ drawMenu(); dev.set(true); };
  rv.box.addEventListener("click", function(e){ if(e.target.getAttribute && e.target.getAttribute("data-close")) rv.set(false); });
  async function openResv(){
    dev.set(false); rv.set(true);
    var body = rv.box.querySelector("#rvBody"); body.textContent = "Загрузка…";
    var data = DATA;
    try{
      var r = await fetch("https://api.github.com/repos/" + REPO + "/contents/prices.js?ref=main&x=" + Date.now(), {headers:{Accept:"application/vnd.github+json"}});
      if(r.ok){
        var j = await r.json(), t = decodeURIComponent(escape(atob(String(j.content).replace(/\s/g,"")))), m = t.match(/window\.PRICE_TEXT\s*=\s*`([\s\S]*)`\s*;?\s*$/);
        if(m) data = parsePrice(m[1].replace(/^\n/,"")).data;
      }
    }catch(e){}
    var html = "", total = 0;
    data.forEach(function(g){ g.items.forEach(function(it){
      var fl = it.f.filter(function(f){ var q = f.split(" · ")[1]; return q && q.toLowerCase() === "бронь"; });
      if(!fl.length) return; total += fl.length;
      html += '<div class="rv-i">' + (it.img ? '<img class="rv-p" alt="" src="' + picSrc(it.img) + '">' : '<div class="rv-p rv-n"></div>') +
        '<div class="rv-t"><b>' + esc(it.n) + '</b><ul>' + fl.map(function(f){ return '<li>' + esc(f.split(" · ")[0]) + '</li>'; }).join("") + '</ul></div></div>';
    }); });
    body.innerHTML = html || "Забронированных вкусов нет.";
    if(!rm && body.animate) Array.prototype.forEach.call(body.querySelectorAll(".rv-i"), function(x, i){ x.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:260,delay:i*50,easing:"ease-out",fill:"backwards"}); });
  }

  /* пять нажатий на заголовок */
  var title = document.querySelector("header.hero h1"), taps = 0, tt2;
  if(title) title.addEventListener("click", function(){
    taps++; clearTimeout(tt2);
    tt2 = setTimeout(function(){ taps = 0; }, 1500);
    if(taps >= 5){ taps = 0; drawMenu(); dev.set(true); }
  });
})();
</script>

</body>
